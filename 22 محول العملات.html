<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محول العملات</title>
    <style>
        body { font-family: Arial; display: flex; flex-direction: column; align-items: center; background: #f4f4f4; padding: 20px; }
        input, select, button { margin: 10px; padding: 10px; }
    </style>
</head>
<body>
    <h1>محول العملات</h1>
    <input type="number" id="amount" placeholder="المبلغ" />
    <select id="fromCurrency"></select>
    <select id="toCurrency"></select>
    <button id="convert">تحويل</button>
    <h2 id="result"></h2>

    <script>
        const apiUrl = 'https://api.exchangerate-api.com/v4/latest/USD';
        const fromCurrency = document.getElementById('fromCurrency');
        const toCurrency = document.getElementById('toCurrency');

        fetch(apiUrl)
            .then(response => response.json())
            .then(data => {
                const currencies = Object.keys(data.rates);
                currencies.forEach(currency => {
                    const option1 = new Option(currency, currency);
                    const option2 = new Option(currency, currency);
                    fromCurrency.add(option1);
                    toCurrency.add(option2);
                });
            });

        document.getElementById('convert').onclick = () => {
            const amount = document.getElementById('amount').value;
            const from = fromCurrency.value;
            const to = toCurrency.value;

            fetch(`https://api.exchangerate-api.com/v4/latest/${from}`)
                .then(response => response.json())
                .then(data => {
                    const rate = data.rates[to];
                    const result = (amount * rate).toFixed(2);
                    document.getElementById('result').innerText = `النتيجة: ${result} ${to}`;
                });
        };
    </script>
</body>
</html>
