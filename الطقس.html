<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weather App</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .container {
      margin-top: 50px;
    }
    .weather-info {
      margin-top: 20px;
      padding: 20px;
      background-color: #f8f9fa;
      border-radius: 10px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1 class="text-center mb-4">Weather App</h1>
    <div class="row justify-content-center">
      <div class="col-md-6">
        <div class="form-group mb-3">
          <label for="cityInput" class="form-label">Enter City:</label>
          <input type="text" class="form-control" id="cityInput" placeholder="Enter city name">
        </div>
        <button class="btn btn-primary w-100" onclick="getWeather()">Get Weather</button>
        
        <div class="weather-info mt-4" id="weatherInfo" style="display: none;">
          <h4>Weather: <span id="weather" class="badge bg-info"></span></h4>
          <h4>Temperature: <span id="temperature" class="badge bg-primary"></span></h4>
          <h4>Humidity: <span id="humidity" class="badge bg-secondary"></span></h4>
        </div>
      </div>
    </div>
  </div>

  <script>
    async function getWeather() {
        //.value: تحصل على القيمة المدخلة>>>>>>>>>>>>>>>.trim(): تزيل المسافات الزائدة من البداية والنهاية
      const city = document.getElementById('cityInput').value.trim();
      //التحقق من إدخال المدينة
      if (!city) {
        alert('Please enter a city name');
        return;
      }

      const apiKey = "e98bc9578d59b9457c9e19e7030ce110"; 
      //  عنوان URL للطلب مع تضمين:
      const apiUrl = `https://api.openweathermap.org/data/2.5/weather?q=${city}&appid=${apiKey}&units=metric`;
//تنفيذ الطلب 
//تتعامل مع الأخطاء
      try {
        //fetch(apiUrl): إرسال طلب HTTP إلى API
        const response = await fetch(apiUrl);
        const data = await response.json();

        if (data.cod === 200) {
          document.getElementById('weather').textContent = data.weather[0].description;
          document.getElementById('temperature').textContent = `${data.main.temp} °C`;
          document.getElementById('humidity').textContent = `${data.main.humidity}%`;
          document.getElementById('weatherInfo').style.display = 'block';
        } else {
          alert(`City not found! ${data.message}. Please enter a valid city name.`);
          document.getElementById('weatherInfo').style.display = 'none';
        }
      } catch (error) {
        console.error('Error fetching weather data:', error);
        alert('An error occurred while fetching weather data. Please try again.');
        document.getElementById('weatherInfo').style.display = 'none';
      }
    }
  </script>
  
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
