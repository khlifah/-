<!DOCTYPE html>
<html lang="ar">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نموذج تسجيل زيارة</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-size: cover;
            background-position: center;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            color: white;
        }

        .container {
            background-color: rgba(255, 255, 255, 0.9);
            border-radius: 15px;
            box-shadow: 0 10px 20px rgba(0.2, 0.2, 0.2, 0.2);
            padding: 40px;
            width: 90%;
            max-width: 500px;
            transition: transform 0.3s;
        }

            .container:hover {
                transform: translateY(-5px);
            }

        h2 {
            text-align: center;
            color: #005f73;
            margin-bottom: 20px;
            font-size: 1.8rem;
            text-shadow: 1px 1px 5px rgba(0, 0, 0, 0.1);
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #333;
        }

        input[type="text"],
        input[type="tel"],
        input[type="date"],
        input[type="file"] {
            width: 100%;
            padding: 12px;
            margin-bottom: 10px;
            border: 2px solid #005f73;
            border-radius: 5px;
            transition: border-color 0.3s, box-shadow 0.3s;
        }

            input[type="text"]:focus,
            input[type="tel"]:focus,
            input[type="date"]:focus {
                border-color: #007f80;
                box-shadow: 0 0 5px rgba(0, 127, 128, 0.5);
                outline: none;
            }

        .char-counter {
            font-size: 0.8rem;
            color: #555;
            text-align: right;
            margin-bottom: 20px;
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: #005f73;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 1.2em;
            cursor: pointer;
            transition: background-color 0.3s, transform 0.3s;
        }

            button:hover {
                background-color: #007f80;
                transform: scale(1.05);
            }

        .footer {
            text-align: center;
            margin-top: 20px;
            color: #777;
            font-size: 0.9rem;
        }

        .speech-btn {
            display: inline-block;
            margin-left: 10px;
            padding: 5px 10px;
            background-color: #007f80;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 0.9rem;
            cursor: pointer;
            transition: background-color 0.3s;
        }

            .speech-btn:hover {
                background-color: #005f73;
            }
    </style>
</head>

<body>
    <div class="container">
        <h2>تسجيل زيارة</h2>
        <form id="visitForm">
            <label for="name">الاسم الكامل:</label>
            <div>
                <input type="text" id="name" name="name" maxlength="20" required>
              
            </div>
            

            <label for="phone">رقم الجوال:</label>
            <div>
                <input type="tel" id="phone" name="phone" maxlength="10" required pattern="[0-9]{10}" placeholder="أدخل رقم الجوال 9 أرقام">
           
            </div>
           

            <label for="passport">صورة الجواز:</label>
            <input type="file" id="passport" name="passport" accept="image/*" required>

            <label for="dob">تاريخ الميلاد:</label>
            <input type="date" id="dob" name="dob" required>

            <label for="passportExpiry">تاريخ انتهاء صلاحية الجواز:</label>
            <input type="date" id="passportExpiry" name="passportExpiry" required>

            <button type="submit">تسجيل</button>
        </form>
        <div class="footer">
            <p>© 2024 جميع الحقوق محفوظة.</p>
        </div>
    </div>

   
</body>

</html>
