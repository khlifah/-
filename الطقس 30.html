<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weather App</title>
  <link href="bootstrap.min.css" rel="stylesheet">
  <style>
    .container {
      margin-top: 50px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1 class="text-center">Weather App</h1>
    <div class="form-group">
      <label for="cityInput">Enter City:</label>
      <input type="text" class="form-control" id="cityInput" placeholder="Enter city name">
    </div>
    <button class="btn btn-primary" onclick="getWeather()">Get Weather</button>
    <div class="mt-3">
      <h4>Weather: <span id="weather"></span></h4>
      <h4>Temperature: <span id="temperature"></span></h4>
      <h4>Humidity: <span id="humidity"></span></h4>
    </div>
  </div>
  <script>
   async function getWeather() {
  const city = document.getElementById('cityInput').value;
  const apiKey = "e98bc9578d59b9457c9e19e7030ce110" // Replace with your actual API key
  const apiUrl = `https://api.openweathermap.org/data/2.5/weather?q=${city}&appid=${apiKey}&units=metric`;

  try {
    const response = await fetch(apiUrl);
    const data = await response.json();

    if (data.cod === 200) {
      document.getElementById('weather').textContent = data.weather[0].description;
      document.getElementById('temperature').textContent = `${data.main.temp} °C`;
      document.getElementById('humidity').textContent = `${data.main.humidity} %`;
    } else {
      alert(`City not found! ${data.message}. Please enter a valid city name.`);
    }
  } catch (error) {
    console.error('Error fetching weather data:', error);
    alert('An error occurred while fetching weather data. Please try again.');
  }
}

  </script>
</body>
</html>
