<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مولد الاقتباسات العشوائية</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; padding: 50px; background-color: #f4f4f4; }
        .quote { font-size: 24px; margin: 20px 0; }
        button { padding: 10px 20px; font-size: 16px; cursor: pointer; }
    </style>
</head>
<body>
    <h1>مولد الاقتباسات العشوائية</h1>
    <div class="quote" id="quote">اضغط على الزر للحصول على اقتباس جديد!</div>
    <button id="newQuote">احصل على اقتباس جديد</button>
  
    <script>
        const quotes = [
            "الحياة ليست عن العثور على نفسك، بل عن خلق نفسك.",
            "النجاح هو القدرة على الانتقال من فشل إلى فشل دون فقدان الحماس.",
            "المستقبل ينتمي لأولئك الذين يؤمنون بجمال أحلامهم.",
            "لا تقم بتقييم كل يوم من الحصاد الذي تحصده، بل من البذور التي تزرعها.",
            "العقل هو كل شيء. ما تعتقد أنك ستصبحه.",
            "اذا كنت تريد تعلم الجافا اسكريبت دع المهندس انس يعلمك"
        ];

        const quoteDisplay = document.getElementById('quote');
        const newQuoteButton = document.getElementById('newQuote');

        newQuoteButton.addEventListener('click', () => {
            const randomIndex = Math.floor(Math.random() * quotes.length);
            quoteDisplay.textContent = quotes[randomIndex];
        });
    </script>
</body>
</html>
