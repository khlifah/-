<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>صور متحركة</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: #111;
        }

        .slider-container {
            position: relative;
            width: 80%;
            max-width: 800px;
            overflow: hidden;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
        }

        .slides {
            display: flex;
            position: relative;
            width: 100%;
        }

        .slide {
            min-width: 100%;
            opacity: 0;
            transition: opacity 0.8s ease-in-out;
        }

            .slide:first-child {
                opacity: 1;
            }

            .slide img {
                width: 100%;
                border-radius: 10px;
            }

        .prev, .next {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(0, 0, 0, 0.5);
            color: white;
            border: none;
            cursor: pointer;
            padding: 10px 15px;
            font-size: 20px;
            border-radius: 5px;
        }

        .prev {
            left: 10px;
        }

        .next {
            right: 10px;
        }

        .dots {
            text-align: center;
            margin-top: 10px;
        }

        .dot {
            height: 10px;
            width: 10px;
            margin: 5px;
            background-color: #bbb;
            border-radius: 50%;
            display: inline-block;
            cursor: pointer;
        }

        .active {
            background-color: white;
        }
    </style>
</head>
<body>

    <div class="slider-container">
        <div class="slides">
            <div class="slide"><img src="1.jpg" alt=""></div>
            <div class="slide"><img src="z.jpg" alt=""></div>
            <div class="slide"><img src="x.jpg" alt=""></div>
        </div>

        <button class="prev">السابق</button>
        <button class="next">التالي</button>
    </div>

    <div class="dots"></div>

    <script>
        const slides = document.querySelectorAll(".slide");
        const prev = document.querySelector(".prev");
        const next = document.querySelector(".next");
        const dotsContainer = document.querySelector(".dots");

        let currentIndex = 0;
        let autoSlideInterval;

        const showSlide = (index) => {
            slides.forEach((slide, i) => slide.style.opacity = i === index ? "1" : "0");
        document.querySelectorAll(".dot").forEach((dot, i) => dot.classList.toggle("active", i === index));
        currentIndex = index;
        };

        const changeSlide = (offset) => {
            showSlide((currentIndex + offset + slides.length) % slides.length);
        resetAutoSlide();
        };

        const startAutoSlide = () => {
            autoSlideInterval = setInterval(() => changeSlide(1), 3000);
        };

        const resetAutoSlide = () => {
            clearInterval(autoSlideInterval);
        startAutoSlide();
        };

        prev.addEventListener("click", () => changeSlide(-1));
        next.addEventListener("click", () => changeSlide(1));

        slides.forEach((_, i) => {
            const dot = document.createElement("span");
        dot.classList.add("dot");
        dotsContainer.appendChild(dot);
        dot.addEventListener("click", () => {
            showSlide(i);
        resetAutoSlide();
        });
        });

        showSlide(0);
        startAutoSlide();
    </script>

</body>
</html>
