<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ساعة رقمية</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            background: #f4f4f4; 
        }
        #clock {
            font-size: 48px; 
            background: #fff; 
            padding: 20px; 
            border-radius: 10px; 
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
        }
    </style>
</head>
<body>
    <div id="clock">00:00:00</div>

    <script>
        function updateClock() {
            const now = new Date();
            const hours = (now.getHours() + 12) % 24; // إضافة 12 ساعة
            const minutes = (now.getMinutes() ) % 60; // إضافة 20 دقيقة
            const seconds = now.getSeconds();
            document.getElementById('clock').textContent = 
                `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
        }
        setInterval(updateClock, 1000); // تحديث الساعة كل ثانية
        updateClock(); // تحديث الساعة على الفور عند تحميل الصفحة
    </script>
</body>
</html>
