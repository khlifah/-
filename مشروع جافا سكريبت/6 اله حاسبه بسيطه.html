<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>آلة حاسبة بسيطة</title>
    <style>
        body { font-family: Arial; display: flex;
                flex-direction: column;
                 align-items: center; height: 100vh; 
                 background: #f4f4f4; 
        }
        input, button { padding: 10px;
                         margin: 8px;
                          font-size: 16px; 
        }
    </style>
</head>
<body>
    <h1>آلة حاسبة بسيطة</h1>
    <input type="number" id="num1" placeholder="اكتب لرقم الاول">
    <input type="number" id="num2" placeholder="اكتب الرقم الثاني">
    <div>
        <button onclick="calculate('+')">جمع</button>
        <button onclick="calculate('-')">طرح</button>
        <button onclick="calculate('*')">ضرب</button>
        <button onclick="calculate('/')">قسمه</button>
    </div>
    <h2 id="result"></h2>

    <script>
        function calculate(operator) {
            const num1 = parseFloat(document.getElementById('num1').value);
            const num2 = parseFloat(document.getElementById('num2').value);
            let result;

            if (operator === '+') result = num1 + num2;
            else if (operator === '-') result = num1 - num2;
            if (operator === '*') result = num1 * num2;
            else if (operator === '/') result = num1 / num2;

            document.getElementById('result').innerText = `النتيجة: ${result}`;
        }
    </script>
</body>
</html>
