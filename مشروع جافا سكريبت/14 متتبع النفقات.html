<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متتبع النفقات</title>
    <style>
        body { font-family: Arial; display: flex; flex-direction: column; align-items: center; background: #f4f4f4; padding: 20px; }
        input, button { margin: 10px; padding: 10px; }
        ul { list-style-type: none; padding: 0; }
    </style>
</head>
<body>
    <h1>متتبع النفقات</h1>
    <input type="text" id="description" placeholder="وصف النفقة" />
    <input type="number" id="amount" placeholder="المبلغ" />
    <button id="addExpense">إضافة نفقة</button>
    <ul id="expenseList"></ul>

    <script>
        document.getElementById('addExpense').onclick = () => {
            const description = document.getElementById('description').value;
            const amount = document.getElementById('amount').value;

            if (description && amount) {
                const li = document.createElement('li');
                li.textContent = `${description}: ${amount} ج.م.`;
                document.getElementById('expenseList').appendChild(li);

                // إعادة تعيين الحقول
                document.getElementById('description').value = '';
                document.getElementById('amount').value = '';
            } else {
                alert('يرجى ملء جميع الحقول');
            }
        };
    </script>
</body>
</html>
